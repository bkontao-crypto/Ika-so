name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: ika_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/ika_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Cache hors connexion : la version du service worker doit correspondre aux fichiers livrés (corrigez avec « npm run stamp-sw »).
      - run: npm run stamp-sw:check
      # Inclut test/integration-pg.test.js : migrations et HTTP sur le PostgreSQL du service ci-dessus (DATABASE_URL_TEST).
      - run: npm test
